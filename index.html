    <!--
      Google tag (gtag.js) — Google Ads conversion tracking.
      The loader is injected ONLY when a real AW- conversion ID is set below,

    -->
    <script>
      (function () {
        var AW_ID = 'AW-CONVERSION_ID_PLACEHOLDER';
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        window.gtag = gtag;
        if (AW_ID.indexOf('PLACEHOLDER') !== -1) return; // not configured yet — skip the request
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + AW_ID;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', AW_ID);
      })();
    </script>
