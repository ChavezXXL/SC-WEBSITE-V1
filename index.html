          "@type": "Question",
          "name": "What is deburring, and why does my part need it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Deburring removes the sharp edges and raised material left by machining, stamping, or cutting. Burrs cause stress fractures, become FOD inside fluid systems, and ruin coatings. It's the final step that turns a machined part into one that's ready to fly."
          }
        },
        {
          "@type": "Question",
          "name": "What kinds of parts do you specialize in?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Complex geometry — manifolds, valve bodies, hydraulic fittings, and anything with cross-drilled or intersecting bores. Built for parts where burrs hide inside and tolerances are tight. Aerospace and medical mainly."
          }
        },
        {
          "@type": "Question",
          "name": "What materials can you deburr?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stainless, aluminum, titanium, Inconel, brass, copper, Invar, carbon steel — plus most plastics. We match the technique to the material so dimensions stay exact."
          }
        },
        {
          "@type": "Question",
          "name": "Can you hold tight tolerances on critical parts?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We remove the burr only. Surrounding edges stay exactly as drawn — we don't round what should stay sharp."
          }
        },
        {
          "@type": "Question",
          "name": "Can you handle cross-drilled holes and internal passages?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It's our specialty. Intersections where bores meet are where most shops miss burrs that turn into FOD. We use microscope inspection and the right tooling to clean every one."
          }
        },
        {
          "@type": "Question",
          "name": "Do you handle prototypes and production runs?",
          "acceptedAnswer": {
            "@type": "Answer",

          "name": "What's your typical turnaround?",

            "text": "Local pickup and delivery for regular customers in LA and the San Fernando Valley. Standard freight everywhere else — pickup arranged for larger jobs."

          "name": "What do you need to send a quote?",

            "@type": "Answer",
            "text": "A drawing or photo, an approximate quantity, and any spec callouts. Quote back in 24 hours."
          }

          "name": "Where is SC Precision Deburring located?",

            "@type": "Answer",
            "text": "Pacoima, California — 12734 Branford Street, Unit 17, in the San Fernando Valley. We serve all of Southern California: Los Angeles, Orange, Ventura, San Bernardino, Riverside, San Diego, and Kern counties."

          "@type": "Question",
          "name": "Are you ISO 9001 or AS9100 certified?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ISO 9001:2015 certified. AS9100 certification is in progress for full aerospace approved-vendor-list eligibility. Documented quality processes on every job, with sign-off on every batch."
          }
        },
        {
          "@type": "Question",
          "name": "What is microscope deburring?",

            "@type": "Answer",
            "text": "Deburring performed under magnification — typically 10x to 40x — for parts where burrs hide inside cross-drilled holes, internal passages, or tight features the naked eye can't catch. Standard for aerospace manifolds, valve bodies, and high-tolerance medical devices."
